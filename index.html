<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Consulta CEP - Teams</title>

  <script src="https://res.cdn.office.net/teams-js/2.22.0/js/MicrosoftTeams.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1f1f1f;
      color: white;
      padding: 24px;
    }

    .card {
      background: #2b2b2b;
      border-radius: 14px;
      padding: 24px;
      max-width: 650px;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #111;
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    button {
      background: #6264a7;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #7476c0;
    }

    .resultado {
      margin-top: 20px;
      background: #111;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 16px;
    }

    .linha {
      margin: 8px 0;
    }

    .ok {
      color: #8cffb1;
      font-weight: bold;
    }

    .erro {
      color: #ff8c8c;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>📍 Consulta de CEP</h1>
    <p>Digite um CEP para consultar endereço usando uma API REST pública.</p>

    <input id="cep" placeholder="Exemplo: 01001000" maxlength="9">
    <button onclick="consultarCep()">Consultar CEP</button>

    <div id="resultado" class="resultado">
      Informe um CEP para iniciar.
    </div>
  </div>

  <script>
    microsoftTeams.app.initialize();

    async function consultarCep() {
      const cep = document.getElementById("cep").value.replace(/\D/g, "");
      const resultado = document.getElementById("resultado");

      if (cep.length !== 8) {
        resultado.innerHTML = '<div class="erro">❌ Informe um CEP com 8 dígitos.</div>';
        return;
      }

      resultado.innerHTML = "🔄 Consultando API...";

      try {
        const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const data = await response.json();

        if (data.erro) {
          resultado.innerHTML = '<div class="erro">❌ CEP não encontrado.</div>';
          return;
        }

        resultado.innerHTML = `
          <div class="ok">✅ Endereço encontrado</div>
          <div class="linha"><b>CEP:</b> ${data.cep || "-"}</div>
          <div class="linha"><b>Logradouro:</b> ${data.logradouro || "-"}</div>
          <div class="linha"><b>Bairro:</b> ${data.bairro || "-"}</div>
          <div class="linha"><b>Cidade:</b> ${data.localidade || "-"}</div>
          <div class="linha"><b>UF:</b> ${data.uf || "-"}</div>
          <div class="linha"><b>DDD:</b> ${data.ddd || "-"}</div>
          <div class="linha"><b>IBGE:</b> ${data.ibge || "-"}</div>
        `;
      } catch (e) {
        resultado.innerHTML = `
          <div class="erro">❌ Erro ao consultar a API.</div>
          <div>${e.message}</div>
        `;
      }
    }
  </script>
</body>
</html>
